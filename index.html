<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polyglot Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Sarabun:wght@300;400;600;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C5CE7; --accent: #00CEC9; --bg: #0C0C1E;
            --card-bg: rgba(30, 30, 50, 0.9); --text: #F1F2F6; --text-light: #A4A4B5;
            --danger: #FF4757;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-thai: 'Sarabun', sans-serif; 
            /* Added support for Chinese and Korean */
            --font-asian: 'Noto Sans SC', 'Noto Sans KR', sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-main);
            margin: 0; background: var(--bg); color: var(--text); 
            line-height: 1.6; padding-bottom: 120px; overflow-x: hidden;
        }
        /* Ensure all text inputs and display areas support Asian characters */
        .vocab-word, .m-btn, input, select, .vocab-row { 
            font-family: var(--font-thai), var(--font-asian), var(--font-main); 
        }
        
        .header { padding: 45px 20px 15px; text-align: center; }
        .status-badge { font-size: 10px; letter-spacing: 2.5px; color: var(--accent); font-weight: 800; text-transform: uppercase; }
        h1 { margin: 8px 0 0; font-weight: 800; font-size: 22px; color: #fff; letter-spacing: -0.5px; }
        
        .tabs-container { display: flex; gap: 10px; padding: 20px; overflow-x: auto; scrollbar-width: none; justify-content: center; }
        .tab { 
            padding: 11px 22px; border-radius: 12px; background: var(--card-bg); 
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 13px;
            color: var(--text-light); border: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); }

        .container { max-width: 500px; margin: 0 auto; padding: 0 20px; }
        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        select, input { 
            width: 100%; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 16px; border-radius: 16px; font-size: 15px; outline: none;
        }
        .content-card { 
            background: var(--card-bg); border-radius: 30px; padding: 28px; 
            border: 1px solid rgba(255,255,255,0.05); min-height: 400px; 
        }
        .vocab-row { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; }
        .vocab-row:active { background: rgba(255,255,255,0.05); }
        .vocab-word { font-size: 22px; font-weight: 600; color: #fff; display: block; }
        .vocab-mean { font-size: 14px; color: var(--text-light); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .m-btn { 
            padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.08); color: #fff; cursor: pointer;
            min-height: 75px; display: flex; align-items: center; justify-content: center; text-align: center; transition: 0.2s;
            font-size: 14px;
        }
        .m-btn.selected { background: var(--primary); border-color: var(--accent); }
        .m-btn.matched { opacity: 0; pointer-events: none; transform: scale(0.8); }
        .m-btn.error { border-color: var(--danger); background: rgba(255, 71, 87, 0.1); }

        .nav { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background: rgba(10, 10, 25, 0.95); backdrop-filter: blur(20px); 
            padding: 12px 20px; border-radius: 40px; display: flex; gap: 20px; 
            border: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-light); cursor: pointer; min-width: 50px;}
        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
        .hidden { display: none; }
        .submit-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div class="status-badge" id="status">Connecting...</div>
    <h1>Polyglot Flow</h1>
</div>

<div class="tabs-container">
    <div class="tab active" onclick="switchLang('Thai')">THAI</div>
    <div class="tab" onclick="switchLang('Chinese')">CHINESE</div>
    <div class="tab" onclick="switchLang('Korean')">KOREAN</div>
</div>

<div id="view-study" class="container">
    <div class="controls">
        <select id="study-chapter" onchange="renderStudy()"></select>
    </div>
    <div id="study-display" class="content-card"></div>
</div>

<div id="view-game" class="container hidden">
    <div class="controls"><select id="game-chapter" onchange="resetGame()"></select></div>
    <div id="game-display" class="content-card"></div>
</div>

<div id="view-upload" class="container hidden">
    <div class="content-card">
        <span class="status-badge">Add New Word</span>
        <div style="margin-top:20px;"></div>
        <select id="select-topic" onchange="toggleTopicInput()" style="margin-bottom:12px;"></select>
        <input type="text" id="in-topic" placeholder="New Category Name" class="hidden" style="margin-bottom:12px;">
        <input type="text" id="in-word" placeholder="Word (Target)" style="margin-bottom:12px;">
        <input type="text" id="in-mean" placeholder="Translation" style="margin-bottom:12px;">
        <button class="submit-btn" id="save-btn" onclick="submitNewWord()">SAVE TO CLOUD</button>
    </div>
</div>

<div id="view-history" class="container hidden">
    <div id="history-display" class="content-card"></div>
</div>

<nav class="nav">
    <div class="nav-item active" id="nav-study" onclick="switchView('study')"><i class="fas fa-book-open"></i><span>Learn</span></div>
    <div class="nav-item" id="nav-game" onclick="switchView('game')"><i class="fas fa-layer-group"></i><span>Match</span></div>
    <div class="nav-item" id="nav-upload" onclick="switchView('upload')"><i class="fas fa-plus"></i><span>Add</span></div>
    <div class="nav-item" id="nav-history" onclick="switchView('history')"><i class="fas fa-history"></i><span>History</span></div>
</nav>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZdK3xJD4uSHxs6KKqNpx8XEj7fwNrodO3ldnrrdUzLv5tUosacAvmDRBq-u-tIaYk/exec"; 

    let cloudData = []; 
    let currentLang = 'Thai';
    let currentView = 'study';
    let selectedLeft = null;
    let gamePool = []; 

    window.onload = () => switchLang('Thai');

    async function switchLang(lang) {
        currentLang = lang;
        document.getElementById('status').innerText = "Loading...";
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === lang.toUpperCase()));
        await fetchCloudData();
    }

    async function fetchCloudData() {
        try {
            const res = await fetch(SCRIPT_URL);
            cloudData = await res.json();
            populateChapters();
            updateTopicDropdown();
            document.getElementById('status').innerText = "Cloud Live";
            if(currentView === 'study') renderStudy();
            if(currentView === 'history') renderHistory();
        } catch (e) { 
            document.getElementById('status').innerText = "Sync Failed";
        }
    }

    function populateChapters() {
        const sSel = document.getElementById('study-chapter');
        const gSel = document.getElementById('game-chapter');
        const topics = [...new Set(cloudData.filter(i => i.lang === currentLang && i.type === 'vocab').map(i => i.topic))];
        let opts = topics.map(t => `<option value="${t}">${t}</option>`).join('');
        sSel.innerHTML = opts || '<option>No Data Found</option>';
        gSel.innerHTML = `<option value="all">Mixed Quiz</option>` + opts;
    }

    function renderStudy() {
        const topic = document.getElementById('study-chapter').value;
        const display = document.getElementById('study-display');
        const filtered = cloudData.filter(i => i.lang === currentLang && i.topic === topic && i.type === 'vocab');
        let html = `<span class="status-badge">${topic}</span><div style="margin-top:20px;"></div>`;
        filtered.forEach(i => {
            html += `<div class="vocab-row" onclick="speak('${i.target}', '${currentLang}')">
                        <span class="vocab-word">${i.target}</span>
                        <span class="vocab-mean">${i.trans}</span>
                     </div>`;
        });
        display.innerHTML = html || "<p style='text-align:center;'>No words in this category.</p>";
    }

    function resetGame() {
        const sel = document.getElementById('game-chapter').value;
        let source = (sel === "all") 
            ? cloudData.filter(i => i.lang === currentLang && i.type === 'vocab')
            : cloudData.filter(i => i.lang === currentLang && i.topic === sel && i.type === 'vocab');
        
        if(source.length < 2) {
            document.getElementById('game-display').innerHTML = "<p style='text-align:center; padding-top:50px;'>Need at least 2 words to play.</p>";
            return;
        }
        gamePool = [...source].sort(() => Math.random() - 0.5);
        renderGameRound();
    }

    function renderGameRound() {
        const display = document.getElementById('game-display');
        selectedLeft = null;
        if (gamePool.length === 0) {
            display.innerHTML = `<div style="text-align:center; padding-top:60px;"><h2>Great Job!</h2><button class="submit-btn" onclick="resetGame()">Play Again</button></div>`;
            return;
        }
        const currentRound = gamePool.splice(0, 5); 
        const left = [...currentRound].sort(() => Math.random() - 0.5);
        const right = [...currentRound].sort(() => Math.random() - 0.5);
        
        let gridHtml = `<div class="grid">`;
        for(let i=0; i < currentRound.length; i++) {
            gridHtml += `<div class="m-btn" id="L-${i}" data-v="${left[i].target}" data-topic="${left[i].topic}" data-trans="${left[i].trans}" onclick="match(this, 'L')">${left[i].trans}</div>`;
            gridHtml += `<div class="m-btn" id="R-${i}" data-v="${right[i].target}" onclick="match(this, 'R')">${right[i].target}</div>`;
        }
        gridHtml += `</div>`;
        display.innerHTML = gridHtml;
    }

    function match(btn, side) {
        if(btn.classList.contains('matched')) return;
        
        if(side === 'L') {
            document.querySelectorAll('[id^="L-"]').forEach(b => b.classList.remove('selected'));
            selectedLeft = btn; btn.classList.add('selected');
        } else if(selectedLeft) {
            if(selectedLeft.dataset.v === btn.dataset.v) {
                speak(btn.innerText, currentLang);
                selectedLeft.classList.add('matched'); btn.classList.add('matched');
                selectedLeft = null;
                if(document.querySelectorAll('.m-btn:not(.matched)').length === 0) {
                    setTimeout(renderGameRound, 600);
                }
            } else {
                btn.classList.add('error');
                setTimeout(() => btn.classList.remove('error'), 500);
                // Log mistake to history
                const payload = { 
                    type: 'wrong', 
                    lang: currentLang, 
                    topic: selectedLeft.dataset.topic, 
                    target: selectedLeft.dataset.v, 
                    trans: selectedLeft.dataset.trans 
                };
                fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
            }
        }
    }

    function renderHistory() {
        const display = document.getElementById('history-display');
        const filtered = cloudData.filter(i => i.lang === currentLang && i.type === 'wrong');
        let html = `<span class="status-badge">Recent Mistakes</span><div style="margin-top:20px;"></div>`;
        if(filtered.length === 0) html += "<p style='text-align:center;'>No mistakes recorded!</p>";
        filtered.reverse().slice(0, 50).forEach(i => {
            html += `<div class="vocab-row" onclick="speak('${i.target}', '${currentLang}')">
                <span class="vocab-word">${i.target}</span><span class="vocab-mean">${i.trans} <small>(${i.topic})</small></span>
            </div>`;
        });
        display.innerHTML = html;
    }

    function switchView(view) {
        currentView = view;
        ['view-study', 'view-game', 'view-upload', 'view-history'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`view-${view}`).classList.remove('hidden');
        document.getElementById(`nav-${view}`).classList.add('active');
        if(view === 'game') resetGame(); 
        if(view === 'history') renderHistory();
    }

    function speak(text, lang) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        const langMap = { 'Thai': 'th-TH', 'Chinese': 'zh-CN', 'Korean': 'ko-KR' };
        msg.lang = langMap[lang] || 'en-US';
        window.speechSynthesis.speak(msg);
    }

    function updateTopicDropdown() {
        const select = document.getElementById('select-topic');
        const topics = [...new Set(cloudData.filter(i => i.lang === currentLang && i.type === 'vocab').map(i => i.topic))];
        let html = '<option value="">-- Select Category --</option>';
        topics.forEach(t => { html += `<option value="${t}">${t}</option>`; });
        html += '<option value="NEW">+ Create New Category</option>';
        select.innerHTML = html;
    }

    function toggleTopicInput() {
        const select = document.getElementById('select-topic');
        const input = document.getElementById('in-topic');
        select.value === "NEW" ? input.classList.remove('hidden') : input.classList.add('hidden');
    }

    async function submitNewWord() {
        const s = document.getElementById('select-topic').value;
        const i = document.getElementById('in-topic').value;
        const target = document.getElementById('in-word').value;
        const trans = document.getElementById('in-mean').value;
        
        if(!target || !trans || (s === "NEW" && !i)) { 
            alert("Please fill all fields"); 
            return; 
        }

        const topicValue = s === "NEW" ? i : s;
        const payload = { type: 'vocab', lang: currentLang, topic: topicValue, target: target, trans: trans };
        
        document.getElementById('save-btn').innerText = "Saving...";
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        
        // Clean up
        document.getElementById('in-word').value = ""; 
        document.getElementById('in-mean').value = "";
        document.getElementById('save-btn').innerText = "SAVE TO CLOUD";
        
        // Refresh
        await fetchCloudData();
        switchView('study');
    }
</script>
</body>
</html>
